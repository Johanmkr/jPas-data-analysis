# Configuration for the SED-shape VAE.
#
# Every value here is a knob with a documented default in
# jpas_da/modeling/config.py. Override on the command line with
#   python -m jpas_da.modeling.train --set model.hidden=[64,32]
# without editing this file.
#
# The defaults are the v2 conditional VAE (references/pipeline-v2-plan.md): a
# two-branch encoder (convolutions over the 54 narrow bands, an MLP for the six
# off-grid bands and log r_bb), brightness as a condition of encoder and
# decoder, a Gaussian likelihood with a brightness-relative floor eps, and the
# standard ELBO (beta = 1) with a KL warm-up.

data:
  path: data/processed/vae_inputs.npz
  rotation: 0

model:
  encoder: conv
  channels: [g, v, mask]
  conditions: [logr]
  latent_dim: 8
  conv_channels: [32, 64]
  kernel_size: 5
  narrow_features: 128
  other_hidden: [64]
  hidden: [256, 128]
  dropout: 0.0

loss:
  name: gaussian_nll
  beta: 1.0
  beta_warmup_fraction: 0.25
  eps: 0.1
  eps_per_band: []
  common_mode: true
  student_t_dof: 5.0

train:
  epochs: 50
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 0.0
  seed: 0
  device: auto
  debug_objects: 1024
  debug_epochs: 2
  log_every: 0

output:
  model_path: models/vae.pt
  metrics_path: reports/metrics.json
