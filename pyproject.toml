[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jpas_da"
version = "0.1.0"
description = "SED-shape analysis of the miniJPAS 60-band photometry: data pipeline, conditional VAE and baselines."
authors = [
  { name = "Johan Mylius-Kroken" },
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["astronomy", "miniJPAS", "photometry", "variational autoencoder", "SED"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]

# Runtime dependencies only: what `make train`, `make predict` and the cluster
# image need. Docs, notebooks and lint tooling live in the dev group so that the
# image (`uv sync --no-dev`) stays as small as it can.
dependencies = [
    "loguru",
    "numpy",
    "pandas",
    "pyarrow>=25.0.1",
    "python-dotenv",
    "pyyaml>=6.0",
    "torch>=2.5",
    "tqdm",
    "typer",
    "wandb>=0.31.0",
]
requires-python = "~=3.10.0"

# torch is resolved from PyPI. On linux-x86_64 that wheel carries the CUDA
# runtime and still imports on a CPU-only host, so one image serves both; the
# GPU driver is never installed here. Nothing in the code depends on the build.


[tool.ruff]
line-length = 99
src = ["jpas_da"]
include = ["pyproject.toml", "jpas_da/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["jpas_da"]
force-sort-within-sections = true


[dependency-groups]
# Installed in the image too: `make smoke` runs the suite inside the container.
test = [
    "pytest",
]
dev = [
    { include-group = "test" },
    "altair>=6.2.2",       # notebooks
    "marimo>=0.25.2",      # notebooks
    "mkdocs",              # documentation site
    "pymdown-extensions",  # snippets: the site pages include the repo's Markdown
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.marimo.runtime]
pythonpath = ["."]
