[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jpas_da"
version = "0.0.1"
description = "Analysing the jpas dataset using data science methods and machine learning techniques."
authors = [
  { name = "Johan Mylius-Kroken" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "altair>=6.2.2",
    "loguru",
    "mkdocs",
    "pandas",
    "pip",
    "pyarrow>=25.0.1",
    "pydantic>=2.7",
    "pytest",
    "python-dotenv",
    "pyyaml>=6.0",
    "ruff",
    "torch>=2.5",
    "tqdm",
    "typer",
    "wandb>=0.31.0",
]
requires-python = "~=3.10.0"

# torch is resolved from PyPI (CPU wheel on Linux). On a GPU node install it
# from the matching CUDA index instead; nothing in the code depends on the build.


[tool.ruff]
line-length = 99
src = ["jpas_da"]
include = ["pyproject.toml", "jpas_da/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["jpas_da"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "altair>=6.2.2",
    "marimo>=0.25.2",
]


[tool.marimo.runtime]
pythonpath = ["."]
